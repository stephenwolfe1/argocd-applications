apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "unifi-ssl.fullname" . }}
  annotations:
    secret.reloader.stakater.com/reload: {{ .Values.secret.ssl.name | quote }}
  labels:
    {{- include "unifi-ssl.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule }}
  concurrencyPolicy: {{ default "Replace" .Values.concurrencyPolicy }}
  suspend: {{ .Values.suspend }}
  jobTemplate:
    spec:
      template:
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: {{ .Chart.Name }}
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            {{- with .Values.securityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            command:
              - /bin/sh
              - -c
              - |
                mc alias set minio $MINIO_HOST $MINIO_ACCESS_KEY $MINIO_SECRET_KEY
                mc cp /data/ssl/tls.crt /data/ssl/tls.key minio/unifi-ssl/
            envFrom:
              - secretRef:
                  name: {{ .Values.secret.env.name }}
            volumeMounts:
              - name: {{ include "unifi-ssl.fullname" . }}
                readOnly: true
                mountPath: "/data/ssl"
          restartPolicy: {{ default "OnFailure" .Values.restartPolicy }}
          volumes:
            - name: {{ include "unifi-ssl.fullname" . }}
              secret:
                secretName: {{ .Values.secret.ssl.name }}