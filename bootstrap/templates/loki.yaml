apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: loki
    server: https://kubernetes.default.svc
  project: main
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.30.1
    helm:
      values: |-
        loki:
          auth_enabled: false
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          ingester:
            chunk_encoding: snappy
          querier:
            max_concurrent: 4
          pattern_ingester:
            enabled: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true

        deploymentMode: SimpleScalable

        backend:
          replicas: 1
        read:
          replicas: 1
        write:
          replicas: 3
          persistence:
            size: 20Gi

        minio:
          enabled: true
          resources:
            requests:
              cpu: 20m
              memory: 48Mi

        lokiCanary:
          enabled: false
        
        chunksCache:
          enabled: false
        
        resultsCache:
          enabled: false

        gateway:
          enabled: false
        
        test:
          enabled: false

        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
          hosts:
            - loki.swolfe.io
          tls:
          - hosts:
              - loki.swolfe.io
            secretName: loki-distributed-tls

  syncPolicy:
    syncOptions:
    - CreateNamespace=true
