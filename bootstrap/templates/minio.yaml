apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: minio
    server: https://kubernetes.default.svc
  project: main
  source:
    path: helm/minio
    repoURL: https://github.com/minio/minio.git
    targetRevision: master
    helm:
      values: |-
        mode: standalone
        persistence:
          size: 20Gi
        resources:
          requests:
            memory: 1Gi
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
          path: /
          hosts:
            - minio.swolfe.io
          tls:
            - secretName: minio.swolfe.io-tls
              hosts:
                - minio.swolfe.io
        consoleIngress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
          path: /
          hosts:
            - minio-ui.swolfe.io
          tls:
            - secretName: minio-ui.swolfe.io-tls
              hosts:
                - minio-ui.swolfe.io
        # users:
        #   - accessKey: console
        #     secretKey: console123
        #     policy: consoleAdmin
        # svcaccts:
        #   - accessKey: externalSecret
        #     existingSecret: unifi
        #     existingSecretKey: secretKey
        #     user: console
        #     policy:
        #       statements:
        #         - resources:
        #             - 'arn:aws:s3:::example*/*'
        #           actions:
        #             - "s3:AbortMultipartUpload"
        #             - "s3:GetObject"
        #             - "s3:DeleteObject"
        #             - "s3:PutObject"
        #             - "s3:ListMultipartUploadParts"
        buckets:
          - name: unifi-ssl
            policy: none
            purge: false
            versioning: false
            objectlocking: false

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
