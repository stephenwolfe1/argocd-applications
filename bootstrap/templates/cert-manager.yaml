apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  destination:
    namespace: cert-manager
    server: {{ .Values.destination }}
  project: {{ .Values.project }}
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.18.2
    helm:
      values: |-
        installCRDs: true
        dns01RecursiveNameservers: 1.1.1.1:53,8.8.4.4:53
        dns01RecursiveNameserversOnly: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
